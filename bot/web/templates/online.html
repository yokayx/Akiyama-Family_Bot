{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Онлайн · {{ server_name }}</h1>
  {% if online_count is not none %}
  <p class="big-online">{{ online_count }} <span class="muted">чейнлов онлайн</span></p>
  {% else %}
  <p class="big-online muted">данные недоступны</p>
  {% endif %}
  {% if error %}<p class="error-note">{{ error }}</p>{% endif %}
</section>
{% endblock %}
