{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Панель стаффа</h1>
  <p class="muted">Вы вошли как {{ user.name }}</p>
  <div class="cards">
    <div class="card">
      <div class="card-title">Заявки</div>
      <div class="card-value">
        <a href="/staff/applications?status=open">{{ open_tickets }}</a>
      </div>
      <div class="card-sub">открытые</div>
    </div>
    <div class="card">
      <div class="card-title">Сборы</div>
      <div class="card-value">
        <a href="/staff/gatherings">{{ active_events }}</a>
      </div>
      <div class="card-sub">активные</div>
    </div>
    <div class="card">
      <div class="card-title">Онлайн</div>
      <div class="card-value">
        {% if online_count is not none %}{{ online_count }}{% else %}—{% endif %}
      </div>
      <div class="card-sub"><a href="/online">→</a></div>
    </div>
  </div>
</section>

<section class="panel">
  <a class="btn" href="/staff/gatherings/create">+ Создать сбор</a>
  <form method="post" action="/auth/logout" class="inline">
    <button class="btn btn-ghost" type="submit">Выйти</button>
  </form>
</section>
{% endblock %}
