{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Состав Akiyama</h1>
  <p class="muted">Всего в составе: <strong>{{ unique_count }}</strong> человек.</p>
</section>
{% if messages %}
  {% for message in messages %}
  <section class="panel">
    <pre class="roster-message">{{ message }}</pre>
  </section>
  {% endfor %}
{% else %}
<section class="panel">
  <p class="muted">Состав не сгенерирован — запустите синхронизацию бота (/refresh).</p>
</section>
{% endif %}
{% endblock %}
